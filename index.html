        <div class=\"channel-section\">

    <script>
        // Configuration
        const M3U_URL = 'https://converse.nathcreqtives.com/playlist.m3u?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiJlZ2l0MiIsImlhdCI6MTc3MDA4NDc0NywiZXhwIjoxNzcwODAzNjE2LCJhY2NvdW50RXhwaXJlZCI6ZmFsc2UsImFjY291bnRFeHBpcmVzQXQiOjE3NzA4MDM2MTZ9.1jopcD7SkfF413ZCqrwMoF163fsi-Au0-5wijFnF26Y';
        const WIDEVINE_LICENSE_URL = 'https://key.nathcreqtives.com/widevine/?deviceId=02:00:00:00:00:00';

        let player;
        let channels = [];
        let currentChannelIndex = -1;

        // Initialize Shaka Player
        function initPlayer() {
            const video = document.getElementById('video');
            player = new shaka.Player(video);

            // Configure DRM with Widevine
            player.configure({
                drm: {
                    servers: {
                        'com.widevine.alpha': WIDEVINE_LICENSE_URL
                    }
                }
            });

            // Error handling
            player.addEventListener('error', onErrorEvent);
            
            // Set initial volume
            video.volume = 0.5;
        }

        // Parse M3U playlist
        async function parseM3U() {
            try {
                const response = await fetch(M3U_URL);
                const text = await response.text();
                
                const lines = text.split('\n');
                const parsedChannels = [];
                
                let currentChannel = null;
                
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    
                    if (line.startsWith('#EXTINF:')) {
                        // Parse channel info
                        const nameMatch = line.match(/,(.+)$/);
                        const name = nameMatch ? nameMatch[1].trim() : `Channel ${parsedChannels.length + 1}`;
                        
                        currentChannel = {
                            name: name,
                            url: null
                        };
                    } else if (line && !line.startsWith('#') && currentChannel) {
                        // This is the URL line
                        currentChannel.url = line;
                        parsedChannels.push(currentChannel);
                        currentChannel = null;
                    }
                }
                
                channels = parsedChannels;
                renderChannels();
                
                if (channels.length > 0) {
                    playChannel(0);
                }
            } catch (error) {
                console.error('Error parsing M3U:', error);
                document.getElementById('channel-grid').innerHTML = 
                    '<div class=\"error-message\">Failed to load channels. Please check the playlist URL.</div>';
            }
        }

        // Render channel grid
        function renderChannels() {
            const grid = document.getElementById('channel-grid');
            
            if (channels.length === 0) {
                grid.innerHTML = '<div class=\"error-message\">No channels found in playlist</div>';
                return;
            }
            
            grid.innerHTML = channels.map((channel, index) => `
                <div class=\"channel-item\" onclick=\"playChannel(${index})\" id=\"channel-${index}\">
                    <div class=\"channel-number\">#${index + 1}</div>
                    <div class=\"channel-name\">${channel.name}</div>
                </div>
            `).join('');
        }

        // Play channel
        async function playChannel(index) {
            if (index < 0 || index >= channels.length) return;
            
            currentChannelIndex = index;
            const channel = channels[index];
            
            // Update UI
            document.querySelectorAll('.channel-item').forEach(item => {
                item.classList.remove('active');
            });
            document.getElementById(`channel-${index}`).classList.add('active');
            document.getElementById('current-channel').textContent = channel.name;
            document.getElementById('loading').style.display = 'block';
            
            // Scroll to active channel
            document.getElementById(`channel-${index}`).scrollIntoView({ 
                behavior: 'smooth', 
                block: 'center' 
            });
            
            try {
                await player.load(channel.url);
                document.getElementById('loading').style.display = 'none';
                console.log('Playing:', channel.name);
            } catch (error) {
                console.error('Error loading channel:', error);
                document.getElementById('loading').textContent = 'Error loading channel';
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                }, 2000);
            }
        }

        // Next channel
        function nextChannel() {
            if (channels.length === 0) return;
            const nextIndex = (currentChannelIndex + 1) % channels.length;
            playChannel(nextIndex);
        }

        // Previous channel
        function previousChannel() {
            if (channels.length === 0) return;
            const prevIndex = currentChannelIndex - 1 < 0 ? channels.length - 1 : currentChannelIndex - 1;
            playChannel(prevIndex);
        }

        // Change volume
        function changeVolume(value) {
            const video = document.getElementById('video');
            video.volume = value / 100;
        }

        // Error handler
        function onErrorEvent(event) {
            console.error('Error code', event.detail.code, 'object', event.detail);
        }

        // Initialize on page load
        async function init() {
            // Check if browser supports Shaka Player
            if (!shaka.Player.isBrowserSupported()) {
                console.error('Browser not supported!');
                document.getElementById('channel-grid').innerHTML = 
                    '<div class=\"error-message\">Your browser does not support this player</div>';
                return;
            }

            initPlayer();
            await parseM3U();
        }

        // Start everything when DOM is ready
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
